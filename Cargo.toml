[workspace]
resolver = "2"
members = ["crates/prism-core", "crates/prism-win", "crates/prism", "crates/prism-ui", "crates/prism-setup"]

[workspace.package]
version = "0.9.10"
edition = "2021"
rust-version = "1.80"
authors = ["Florian Martins"]
license = "MIT"
repository = "https://github.com/FlorianMartins/Prism-OS"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
