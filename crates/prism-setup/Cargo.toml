[package]
name = "prism-setup"
description = "Programme d'installation de Prism OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "prism-setup"
path = "src/main.rs"

[dependencies]
prism-ui = { path = "../prism-ui" }
prism-win = { path = "../prism-win" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "x11"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"
