# Prism OS — catalogue d'allègement de Windows (embarqué dans prism.exe).
#
# Chaque entrée est réversible : la valeur d'origine est journalisée et
# `prism allege restore` la remet.
#
# tier :
#   sur        appliqué par `prism allege apply` ; aucune fonction utile à un PC de jeu perdue
#   avance     sur demande (`prism allege apply avance`) : gain réel, contrepartie expliquée
#   jeu        réglages orientés jeu (`prism allege apply jeu`)
#
# (Les services Xbox Live ne figurent pas ici : ils sont déjà en démarrage manuel
#  d'usine sur Windows 11, vérifié en VM le 2026-10-04.)
#
# Règle anti-cheat : aucune entrée ne peut viser un service de la liste `protected`
# (vérifié par un test). Voir docs/anticheat-rules.md.

# ---------------------------------------------------------------------------
# Services jamais touchés, avec la raison. La liste fait foi pour toute
# contribution future.
# ---------------------------------------------------------------------------
# Dossiers de tâches planifiées jamais touchés (clé de premier niveau : elle doit
# précéder toutes les tables du fichier).
protected_tasks = [
  '\Microsoft\Windows\WindowsUpdate\',
  '\Microsoft\Windows\UpdateOrchestrator\',
  '\Microsoft\Windows\WaaSMedic\',
  '\Microsoft\Windows\Windows Defender\',
  '\Microsoft\Windows\TPM\',
  '\Microsoft\Windows\Time Synchronization\',
  '\Microsoft\Windows\BitLocker\',
  '\Microsoft\Windows\InstallService\',
  '\Microsoft\Windows\Plug and Play\',
  '\Microsoft\XblGameSave\',
]

# Paquets du Store jamais retirés (début du nom, clé de premier niveau).
protected_apps = [
  "Microsoft.WindowsStore", "Microsoft.StorePurchaseApp", "Microsoft.DesktopAppInstaller",
  "Microsoft.Xbox", "Microsoft.GamingApp", "Microsoft.GamingServices",
  "Microsoft.VCLibs", "Microsoft.UI.Xaml", "Microsoft.NET", "Microsoft.WindowsAppRuntime",
  "Microsoft.SecHealthUI", "Microsoft.Windows.", "Microsoft.AAD", "Microsoft.AccountsControl",
  "Microsoft.LockApp", "Microsoft.WindowsTerminal", "Microsoft.WindowsNotepad",
  "Microsoft.WindowsCalculator", "Microsoft.Windows.Photos", "Microsoft.Paint",
  "Microsoft.ScreenSketch", "Microsoft.HEIFImageExtension", "Microsoft.VP9VideoExtensions",
  "Microsoft.WebMediaExtensions", "Microsoft.WebpImageExtension", "Microsoft.HEVCVideoExtension",
  "Microsoft.AV1VideoExtension", "Microsoft.RawImageExtension",
  # Shell de Windows 11 (pas tout le préfixe : WebExperience = Widgets, retirable).
  "MicrosoftWindows.Client.CBS", "MicrosoftWindows.Client.Core", "MicrosoftWindows.Client.FileExp",
  "MicrosoftWindows.Client.LKG", "MicrosoftWindows.Client.Photon", "MicrosoftWindows.Client.AIX",
  "MicrosoftWindows.Client.OOBE", "MicrosoftWindows.Client.CoreAI", "MicrosoftWindows.CrossDevice",
  "MicrosoftWindows.UndockedDevKit", "MicrosoftWindows.LKG",
  "Microsoft.ApplicationCompatibilityEnhancements", "Microsoft.MicrosoftEdge",
]

[[protected]]
reason = "Mises à jour : les anti-cheats et les jeux exigent un Windows à jour"
services = ["wuauserv", "UsoSvc", "BITS", "WaaSMedicSvc", "TrustedInstaller", "msiserver", "DoSvc"]

[[protected]]
reason = "Vérification des signatures : sans elle, les pilotes d'anti-cheat (vgk, EAC, BattlEye) ne se chargent pas"
services = ["CryptSvc", "KeyIso", "SamSs", "VaultSvc"]

[[protected]]
reason = "WMI : les anti-cheats y lisent les identifiants matériels"
services = ["Winmgmt"]

[[protected]]
reason = "TPM et Secure Boot : exigés par Vanguard et FACEIT"
services = ["tbs"]

[[protected]]
reason = "Heure système : l'authentification des anti-cheats et le TLS en dépendent"
services = ["W32Time"]

[[protected]]
reason = "Sécurité : Defender, centre de sécurité, pare-feu"
services = ["WinDefend", "WdNisSvc", "SecurityHealthService", "wscsvc", "mpssvc", "BFE", "Sense"]

[[protected]]
reason = "Anti-cheats eux-mêmes"
services = ["vgc", "vgk", "EasyAntiCheat", "EasyAntiCheat_EOS", "BEService", "FACEIT", "FACEITService", "EAAntiCheatService"]

[[protected]]
reason = "Licences et installation des jeux du Store / Game Pass"
services = ["ClipSVC", "LicenseManager", "AppXSvc", "GamingServices", "GamingServicesNet", "InstallService", "TokenBroker", "wlidsvc"]

[[protected]]
reason = "Cœur du système"
services = [
  "RpcSs", "RpcEptMapper", "DcomLaunch", "PlugPlay", "Power", "ProfSvc", "LSM", "gpsvc",
  "EventLog", "Schedule", "SystemEventsBroker", "BrokerInfrastructure", "CoreMessagingRegistrar",
  "StateRepository", "UserManager", "Themes", "FontCache", "TextInputManagementService",
]

[[protected]]
reason = "Réseau, son, périphériques"
services = [
  "Dhcp", "Dnscache", "NlaSvc", "nsi", "netprofm", "WinHttpAutoProxySvc", "iphlpsvc",
  "Audiosrv", "AudioEndpointBuilder", "bthserv", "BthAvctpSvc", "hidserv", "WpnService",
]

[[protected]]
reason = "WSL et virtualisation (VBS/HVCI exigés par certains anti-cheats)"
services = ["vmcompute", "HvHost", "LxssManager", "vmms"]

