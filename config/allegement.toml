# ---------------------------------------------------------------------------
# Registre : stratégies officielles et réglages documentés.
# hive = hklm (défaut) | hkcu ; data = nombre (DWORD) ou "texte" (REG_SZ) ;
# reboot = true si la prise en compte demande un redémarrage / une reconnexion.
# Seules les clés de REGISTRY_ALLOWLIST (prism-core/src/allege.rs) sont permises.
# ---------------------------------------------------------------------------
[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\DataCollection'
value = "AllowTelemetry"
data = 0
label = "Télémétrie au minimum autorisé"
tier = "sur"
why = "0 coupe la télémétrie sur Entreprise/Éducation ; sur Famille/Pro, Windows la ramène au niveau « obligatoire », le plus bas permis."

# Widgets : la stratégie Dsh\AllowNewsAndInterests est verrouillée par Windows 11
# (accès refusé même en administrateur, vérifié en VM 26H2 le 2026-10-04). Prism ne
# contourne pas une protection de Windows : le niveau extrême retire le paquet des
# Widgets (opération standard, réinstallable depuis le Store), sinon les désactiver dans
# Paramètres > Personnalisation > Barre des tâches.

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Edge'
value = "StartupBoostEnabled"
data = 0
label = "Edge : pas de préchargement au démarrage"
tier = "sur"
why = "Edge lance sinon des processus cachés dès l'ouverture de session."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Edge'
value = "BackgroundModeEnabled"
data = 0
label = "Edge : pas d'exécution en arrière-plan"
tier = "sur"
why = "Edge garde sinon des processus actifs après fermeture de la dernière fenêtre."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo'
value = "DisabledByGroupPolicy"
data = 1
label = "Identifiant publicitaire désactivé"
tier = "sur"
why = "Empêche le suivi publicitaire entre applications."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\System'
value = "PublishUserActivities"
data = 0
label = "Historique d'activité non enregistré"
tier = "sur"
why = "Windows n'enregistre plus les activités (fichiers ouverts, sites) pour la chronologie."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\System'
value = "UploadUserActivities"
data = 0
label = "Historique d'activité non envoyé"
tier = "sur"
why = "Pas d'envoi de l'historique d'activité vers le cloud."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\CloudContent'
value = "DisableWindowsConsumerFeatures"
data = 1
label = "Pas d'applis suggérées installées d'office"
tier = "sur"
why = "Empêche l'installation automatique d'applis promues (effet complet sur Entreprise/Éducation)."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\GameDVR'
value = "AllowGameDVR"
data = 0
label = "Capture de la Game Bar désactivée"
tier = "avance"
why = "Supprime l'enregistrement en arrière-plan qui coûte des FPS. Contrepartie : plus de clips ni de captures via Win+G (OBS, ShadowPlay, ReLive restent utilisables)."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\OneDrive'
value = "DisableFileSyncNGSC"
data = 1
label = "OneDrive désactivé"
tier = "avance"
why = "OneDrive ne démarre plus ni ne synchronise. Contrepartie : plus de sauvegarde cloud des dossiers."

# ---------------------------------------------------------------------------
# Réglages jeu (tier = "jeu")
# ---------------------------------------------------------------------------
[[registry]]
hive = "hkcu"
key = 'Software\Microsoft\GameBar'
value = "AutoGameModeEnabled"
data = 1
label = "Mode Jeu de Windows activé"
tier = "jeu"
why = "Windows donne la priorité au jeu et diffère Windows Update pendant la partie. Activé d'usine sur la plupart des PC : on s'en assure."

[[registry]]
key = 'SYSTEM\CurrentControlSet\Control\GraphicsDrivers'
value = "HwSchMode"
data = 2
reboot = true
label = "Planification GPU accélérée par le matériel"
tier = "jeu"
why = "Requise pour la génération d'images (DLSS 3, FSR 3) et réduit le travail du processeur pour le GPU. Sans effet sur une carte qui ne la gère pas. Redémarrage nécessaire."

[[registry]]
hive = "hkcu"
key = 'Software\Microsoft\DirectX\UserGpuPreferences'
value = "DirectXUserGlobalSettings"
data = "SwapEffectUpgradeEnable=1;"
label = "Optimisations pour les jeux en fenêtre"
tier = "jeu"
why = "Les jeux DirectX 10/11 en fenêtre ou plein écran fenêtré profitent de la latence et du VRR du plein écran."

[[registry]]
hive = "hkcu"
key = 'Control Panel\Mouse'
value = "MouseSpeed"
data = "0"
reboot = true
label = "Précision du pointeur améliorée désactivée"
tier = "jeu"
why = "Supprime l'accélération de la souris : le même geste donne toujours le même déplacement, ce qu'attend la visée. Prise en compte à la prochaine ouverture de session."

[[registry]]
hive = "hkcu"
key = 'Control Panel\Mouse'
value = "MouseThreshold1"
data = "0"
reboot = true
label = "Accélération souris : seuil 1 à zéro"
tier = "jeu"
why = "Complète la désactivation de l'accélération (même effet que la case de Windows)."

[[registry]]
hive = "hkcu"
key = 'Control Panel\Mouse'
value = "MouseThreshold2"
data = "0"
reboot = true
label = "Accélération souris : seuil 2 à zéro"
tier = "jeu"
why = "Complète la désactivation de l'accélération (même effet que la case de Windows)."

# ---------------------------------------------------------------------------
# Stratégies supplémentaires (2026-10-04)
# ---------------------------------------------------------------------------
[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
value = "DODownloadMode"
data = 0
label = "Mises à jour : pas d'envoi vers d'autres PC"
tier = "sur"
why = "Windows cesse de partager les mises à jour avec d'autres PC sur Internet : votre débit montant reste libre pendant le jeu. Les mises à jour continuent normalement."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
value = "DisableAIDataAnalysis"
data = 1
label = "Recall désactivé"
tier = "sur"
why = "Recall capture l'écran en continu pour l'IA (PC Copilot+) : coût en disque et en processeur, et sensible pour la vie privée."

[[registry]]
hive = "hkcu"
key = 'Software\Policies\Microsoft\Windows\Explorer'
value = "DisableSearchBoxSuggestions"
data = 1
label = "Recherche du menu Démarrer sans Bing"
tier = "sur"
why = "Plus de résultats web ni de suggestions en ligne : la recherche reste locale et plus rapide."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
value = "LetAppsRunInBackground"
data = 2
label = "Applis du Store bloquées en arrière-plan"
tier = "avance"
why = "Les applis du Store ne tournent plus quand elles sont fermées. Contrepartie : leurs notifications (Teams, WhatsApp du Store…) n'arrivent qu'à l'ouverture."


# --- Niveau extrême
[[registry]]
hive = "hkcu"
key = 'Software\Policies\Microsoft\Windows\WindowsCopilot'
value = "TurnOffWindowsCopilot"
data = 1
reboot = true
label = "Copilot désactivé"
tier = "extreme"
why = "Copilot est une appli WebView qui peut rester en arrière-plan. Contrepartie : plus de Copilot intégré (le site reste accessible)."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\Windows Chat'
value = "ChatIcon"
data = 3
label = "Conversation Teams retirée de la barre"
tier = "extreme"
why = "Empêche le lancement de Teams (personnel) par la barre des tâches."

[[registry]]
key = 'SOFTWARE\Policies\Microsoft\Windows\Windows Search'
value = "AllowCortana"
data = 0
label = "Cortana désactivée"
tier = "extreme"
why = "Ancien assistant vocal, encore présent sur certaines installations."

