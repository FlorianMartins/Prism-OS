name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI ne publie rien.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Une seule vérification à la fois par branche : un nouveau commit arrête celle du
# précédent (annulée, en gris) au lieu d'empiler des jobs en file. Le 2026-10-05, huit
# commits poussés en 30 min ont saturé les machines GitHub du compte : des jobs ont
# attendu 15 min une machine (« not acquired by Runner ») puis échoué, sans défaut de code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Logique + compilation croisée (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # pinned by SHA: the toolchain can no longer be read from the ref
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - name: Rendu Vulkan logiciel (captures de l'interface)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Le code Windows vérifié depuis Linux
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo run -q -p prism -- demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: captures-interface
          path: target/ui-shots/*.png

  windows:
    name: Tests sur un vrai Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # pinned by SHA: the toolchain can no longer be read from the ref
      - name: Tests (cœur + intégration Windows réelle)
        run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release -p prism -p prism-ui
      - name: Fumée — le binaire répond sur Windows
        shell: pwsh
        run: |
          $exe = "target/release/prism.exe"
          & $exe version
          & $exe status
          & $exe ram
          & $exe profile
          & $exe tools reverse
          & $exe ram clean
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installateur MSI (WiX 5) et programme d'installation
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build -arch x64 -culture fr-FR -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d Version=$v -d Bin=target\release -o "prism-$v-x64.msi" installer\prism.wxs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PRISM_MSI = (Resolve-Path "prism-$v-x64.msi").Path
          cargo build --release -p prism-setup
          Copy-Item target\release\prism-setup.exe "Prism-Setup-$v.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prism-windows-x64
          path: |
            target/release/prism.exe
            target/release/prism-bar.exe
            target/release/prism-ui.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prism-installer
          path: |
            prism-*-x64.msi
            Prism-Setup-*.exe

  installer:
    name: Contrôles de l'installateur
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prism-windows-x64
          path: bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prism-installer
          path: dist
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq msitools
      - name: Aucun runtime Visual C++, paquet complet, nettoyage bien placé
        run: |
          # Aucun programme ne doit dépendre du runtime Visual C++ (absent d'un Windows neuf).
          for f in bin/*.exe dist/Prism-Setup-*.exe; do
            if objdump -p "$f" | grep -iE "DLL Name: (vcruntime|msvcp)"; then echo "$f dépend du runtime Visual C++"; exit 1; fi
          done
          msi=$(ls dist/prism-*-x64.msi)
          msiinfo export "$msi" File | grep -q prism-ui.exe
          msiinfo export "$msi" Property | grep -P "^Manufacturer\tHivey"
          seq=$(msiinfo export "$msi" InstallExecuteSequence | tr -d '\r')
          init=$(echo "$seq" | awk -F'\t' '$1=="InstallInitialize"{print $3}')
          clean=$(echo "$seq" | awk -F'\t' '$1=="PrismCleanup"{print $3}')
          fin=$(echo "$seq" | awk -F'\t' '$1=="InstallFinalize"{print $3}')
          echo "InstallInitialize=$init PrismCleanup=$clean InstallFinalize=$fin"
          test "$clean" -gt "$init" && test "$clean" -lt "$fin"
          # Le programme d'installation embarque bien le paquet (plusieurs Mo).
          test "$(stat -c %s dist/Prism-Setup-*.exe)" -gt 15000000
