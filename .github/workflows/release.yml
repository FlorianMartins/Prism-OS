name: Publication

# Une étiquette vX.Y.Z publie une version : programmes compilés sur Windows,
# programme d'installation Prism-Setup.exe (assistant animé), paquet MSI (installations
# silencieuses), empreintes SHA-256 (lues par `prism maj` avant toute installation).
on:
  push:
    tags: ["v*"]

# Lecture seule par défaut ; seul le job `publish` écrit (création de la version).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Programmes et installateurs (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # pinned by SHA: the toolchain can no longer be read from the ref
      - name: L'étiquette correspond à la version du code
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "étiquette $GITHUB_REF_NAME ≠ version $version"; exit 1; }
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release -p prism -p prism-ui
      - name: MSI (WiX 5) puis Prism-Setup.exe
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build -arch x64 -culture fr-FR -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d Version=$v -d Bin=target\release -o "prism-$v-x64.msi" installer\prism.wxs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PRISM_MSI = (Resolve-Path "prism-$v-x64.msi").Path
          cargo build --release -p prism-setup
          Copy-Item target\release\prism-setup.exe "Prism-Setup-$v.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            prism-*-x64.msi
            Prism-Setup-*.exe
            target/release/prism.exe
            target/release/prism-bar.exe
            target/release/prism-ui.exe

  publish:
    name: Contrôles et publication
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Contrôles et empreintes
        run: |
          cd dist
          while IFS= read -r f; do
            if objdump -p "$f" | grep -iE "DLL Name: (vcruntime|msvcp)"; then echo "$f dépend du runtime Visual C++"; exit 1; fi
          done < <(find . -name "*.exe")
          # Copie au nom fixe : lien permanent vers la dernière version,
          # https://github.com/<dépôt>/releases/latest/download/Prism-Setup.exe
          cp Prism-Setup-*.exe Prism-Setup.exe
          sha256sum Prism-Setup-*.exe Prism-Setup.exe prism-*-x64.msi > SHA256SUMS
          cat SHA256SUMS
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" Prism-Setup-*.exe Prism-Setup.exe prism-*-x64.msi SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Prism OS $GITHUB_REF_NAME" --generate-notes
