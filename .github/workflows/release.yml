name: Publication

# Une étiquette vX.Y.Z publie une version : binaires compilés sur Windows, installateur
# MSI, empreintes SHA-256 (lues par `prism maj` avant toute installation).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Binaires Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: L'étiquette correspond à la version du code
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "étiquette $GITHUB_REF_NAME ≠ version $version"; exit 1; }
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release -p prism -p prism-ui
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: |
            target/release/prism.exe
            target/release/prism-bar.exe
            target/release/prism-ui.exe

  publish:
    name: Installateur et publication
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wixl msitools
      - name: MSI et empreintes
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          wixl -a x64 -D Version="$version" -D Bin=bin -o "prism-$version-x64.msi" installer/prism.wxs
          sha256sum "prism-$version-x64.msi" > SHA256SUMS
          cat SHA256SUMS
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" prism-*-x64.msi SHA256SUMS --title "Prism OS $GITHUB_REF_NAME" --generate-notes
